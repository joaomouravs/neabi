# Hospedagem na Netlify.
#
# O adaptador oficial de Next.js (OpenNext) é detectado e instalado pela própria
# Netlify. O `npm run build` aplica as migrações só no contexto de produção
# (scripts/migrate-on-deploy.mjs), e a expiração diária das reservas é a função
# agendada em netlify/functions/.
#
# No plano gratuito cada deploy de produção custa 15 dos 300 créditos do mês;
# deploy previews e branch deploys não são cobrados.

[build]
  command = "npm run build"
  publish = ".next"
  # Produção só é reconstruída quando um commit pede [publicar] — cada deploy
  # de produção custa 15 créditos. Ver scripts/netlify-ignorar-build.mjs.
  ignore = "node scripts/netlify-ignorar-build.mjs"

[build.environment]
  NODE_VERSION = "22"
  # Sem telemetria do Next no build.
  NEXT_TELEMETRY_DISABLED = "1"
